# twobullets on one host, built from this repo. From infra/:  docker compose up -d --build
# The site listens on 127.0.0.1:${TB_HTTP_PORT}; put the host's nginx (TLS) in front — see nginx/twobullets.conf.
name: twobullets

services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TB_HTTP_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: infra/docker/server-api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      TB_ENV: production
      TB_PUBLIC_URL: https://${TB_DOMAIN:?set TB_DOMAIN in .env}
      TB_MATCH_URL_TEMPLATE: wss://${TB_DOMAIN}/gs/{port}/m/{matchId}
      TB_API_HOST: 0.0.0.0
      TB_MATCH_BIND_HOST: 0.0.0.0
      TB_TRUST_PROXY: "1"
      TB_DATA_DIR: /data
    expose:
      - "8080"
      - "7400-7409"
    volumes:
      - tb_data:/data
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${TB_SERVER_MEMORY_LIMIT:-2g}

volumes:
  tb_data:
