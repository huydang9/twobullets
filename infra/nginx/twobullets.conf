# Host nginx site for twobullets. Copy to /etc/nginx/sites-available/, symlink into sites-enabled, then:
#   nginx -t && systemctl reload nginx && certbot --nginx -d twobullets.huydang.me
server {
    listen 80;
    listen [::]:80;
    server_name twobullets.huydang.me;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # WebSockets: lobby push (/v1/ws) and match traffic (/gs/...).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_twobullets;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade_twobullets {
    default upgrade;
    ''      close;
}
