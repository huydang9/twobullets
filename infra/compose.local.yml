# Local smoke of the production shape (Caddy + server-api), built from this checkout, plain HTTP on localhost:8080.
#   docker compose -f infra/compose.local.yml up --build
#   curl http://localhost:8080/v1/version
# TB_ALLOCATOR=fake until server-match has `--mode=agent` (docs/release/plan.md §3); then set it to `process` to fork
# real match processes. Heavy: the web image runs a full Vite build (~2–4 GB RAM). Close other apps first.
name: twobullets-local

services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "8080:8080"
    environment:
      TB_SITE_ADDRESS: http://localhost:8080
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: infra/docker/server-api.Dockerfile
      args:
        TB_BUILD: local
    environment:
      # development: generates a throwaway JWT key file in the volume on first start.
      TB_ENV: development
      TB_PUBLIC_URL: http://localhost:8080
      TB_MATCH_URL_TEMPLATE: ws://localhost:8080/gs/{port}/m/{matchId}
      TB_ALLOCATOR: ${TB_ALLOCATOR:-fake}
      TB_MAX_MATCHES: "2"
      TB_QUEUE_START_AFTER_SEC: "10"
    expose:
      - "8080"
      - "7400-7419"
    volumes:
      - tb_local_data:/data

volumes:
  tb_local_data:
