# Build, push and (optionally) deploy twobullets.
#   - push a tag v*        → test, build + push images tagged with the version and sha-<short>
#   - manual "Run workflow" → same, plus deploy when `deploy` is ticked (needs the `production` environment approval)
# Repository settings the owner creates (Settings → Secrets and variables → Actions, environment "production"):
#   secrets  DEPLOY_SSH_KEY (private key of the `deploy` user on the VPS), DEPLOY_KNOWN_HOSTS (ssh-keyscan output)
#   vars     DEPLOY_SSH (deploy@play.example.com)
# Images go to ghcr.io/<owner>/twobullets-{server-api,web}; GITHUB_TOKEN is enough to push them. Make the packages
# private or public in GitHub → Packages; the VPS logs in once with a read-only token if private.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after building"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Backend tests
        run: |
          pnpm --filter @twobullets/contracts --filter @twobullets/protocol --filter @twobullets/netcode test
          pnpm --filter @twobullets/server-match test
          pnpm --filter @twobullets/server-api test

  images:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [server-api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/twobullets-${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TB_BUILD=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          TB_DEPLOY_SSH: ${{ vars.DEPLOY_SSH }}
        run: |
          TAG="sha-$(git rev-parse --short=7 HEAD)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then TAG="${GITHUB_REF_NAME}"; fi
          infra/scripts/deploy.sh "$TAG"
